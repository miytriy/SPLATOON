<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>インク・ペイントシステム プロトタイプ（リファクタ版）</title>
<style>
  :root{
    --bg:#14161c; --panel:#1d2029; --ink:#ff5a1f; --ink-dark:#b5390f;
    --floor:#2a2d38; --text:#eef0f4; --muted:#7d8394; --accent:#33e6c0;
  }
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);
    font-family:"Helvetica Neue","Hiragino Sans","Yu Gothic",sans-serif;
    display:flex;align-items:center;justify-content:center;overflow:hidden;}
  #app{display:flex;flex-direction:column;gap:14px;align-items:center;width:100%;max-width:1200px;}
  #stage-wrap{position:relative;border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px #33384a,0 20px 50px -20px #000;}
  canvas{display:block;background:var(--floor);}
  #hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}
  .card{background:rgba(13,14,18,.72);backdrop-filter:blur(4px);border:1px solid #33384a;border-radius:8px;padding:8px 12px}
  #footer{display:flex;gap:12px;align-items:center;color:var(--muted);padding:8px 0}
  kbd{background:#0b0c10;border:1px solid #33384a;border-radius:4px;padding:1px 6px;color:var(--text)}
  button{background:var(--panel);color:var(--text);border:1px solid #33384a;border-radius:6px;padding:6px 10px;cursor:pointer}
  #weapon-switch{display:flex;gap:6px}
  #weapon-switch button{pointer-events:auto}
  #charge-wrap{display:none}
  /* small responsive */
  @media (max-width:1100px){ #stage-wrap canvas{width:100%;height:auto} }
</style>
</head>
<body>
<div id="app">
  <h1>Ink <span style="color:var(--ink)">Paint</span> System — Prototype</h1>
  <div id="stage-wrap">
    <canvas id="stage" width="1000" height="600"></canvas>
    <div id="hud">
      <div class="card">
        <div style="font-size:11px;color:var(--muted)">塗りポイント</div>
        <div id="coverage-value" style="font-size:20px;font-weight:700;color:var(--accent)">0pt</div>
      </div>

      <div class="card" id="weapon-card" style="min-width:220px;pointer-events:none">
        <div style="font-size:11px;color:var(--muted)">ブキ</div>
        <div id="weapon-name" style="font-weight:700;font-size:15px">–</div>
        <div id="weapon-stats" style="font-size:11px;color:var(--muted);margin-top:4px">–</div>
        <div id="charge-wrap" style="margin-top:8px;">
          <div style="font-size:11px;color:var(--muted)">チャージ</div>
          <div id="charge-gauge-outer" style="width:140px;height:8px;border-radius:4px;background:#0b0c10;overflow:hidden;margin-top:4px;border:1px solid #33384a;">
            <div id="charge-gauge-inner" style="height:100%;width:0%;background:linear-gradient(90deg,var(--accent),#fff);transition:width .05s linear"></div>
          </div>
        </div>
      </div>

      <div class="card" style="text-align:right;pointer-events:none">
        <div style="font-size:11px;color:var(--muted)">インク残量</div>
        <div id="ink-gauge-outer" style="width:120px;height:8px;border-radius:4px;background:#0b0c10;overflow:hidden;margin-top:6px;border:1px solid #33384a">
          <div id="ink-gauge-inner" style="height:100%;width:100%;background:linear-gradient(90deg,var(--ink-dark),var(--ink));transition:width .08s linear"></div>
        </div>
        <div id="swim-badge" style="font-size:10px;color:var(--muted);margin-top:6px">◆ ヒト状態：自然回復のみ</div>
      </div>
    </div>
  </div>

  <div id="footer">
    <div><kbd>W A S D</kbd> 移動</div>
    <div><kbd>マウス</kbd> 照準　<kbd>左クリック(長押し)</kbd> 発射／チャージャーはチャージして離す</div>
    <div><kbd>右クリック</kbd> イカ（自陣インク上で回復）</div>
    <div style="margin-left:auto">
      <button id="reset-btn">塗りをリセット</button>
      <button id="toggle-coverage-btn">Coverage 表示</button>
    </div>
  </div>

  <div style="margin-top:6px;display:flex;gap:8px;align-items:center">
    <div id="weapon-switch"></div>
  </div>
</div>

<script>
/* Refactored, self-contained index.html
   - fixes prior crash points (guarded globals)
   - separates coverage vs visual blobs (coverage always opaque)
   - adds charger (リッター4K) basic charging + firing
   - coverage sampling (downsample) and HUD update
   This is a working prototype; tuning can be done later.
*/

// --- Canvas setup
const stage = document.getElementById('stage');
const ctx = stage.getContext('2d');
const W = stage.width, H = stage.height;

const paintLayer = document.createElement('canvas');
paintLayer.width = W; paintLayer.height = H;
const pctx = paintLayer.getContext('2d');

const coverageLayer = document.createElement('canvas');
coverageLayer.width = W; coverageLayer.height = H;
const cctx = coverageLayer.getContext('2d');

// --- constants / colours
const TEAM_COLOR = '#ff5a1f';
const TEAM_COLOR_RGB = [255,90,31];

// Obstacles (unpaintable)
const OBSTACLES = [
  {x:360,y:120,w:80,h:120},
  {x:150,y:380,w:180,h:40},
  {x:560,y:340,w:160,h:40},
];

function rectsOverlap(x,y,r,rect){
  return x + r > rect.x && x - r < rect.x + rect.w &&
         y + r > rect.y && y - r < rect.y + rect.h;
}

// --- unit helpers
const METERS_PER_LINE = 5;
const PIXELS_PER_LINE = 100;
function lines(n){ return n * PIXELS_PER_LINE; }
function framesToSeconds(f){ return f / 60; }

// --- weapons (includes リッター4K as requested)
const WEAPONS = [
  { // スプラシューター (simple shooter)
    name:'スプラシューター',
    type:'shooter',
    weightClass:'中量級',
    fireIntervalSec: framesToSeconds(6),
    inkPerShot: 100/108,
    speedDU: 22.66,
    splatRadiusLines: 0.15,
    spreadDeg:4.86,
    preShotFramesHumanoid:2,
    postShotFrames:4,
  },
  { // わかば (kept simple)
    name:'わかばシューター',
    type:'shooter',
    weightClass:'軽量級',
    fireIntervalSec: framesToSeconds(5),
    inkPerShot: 100*1.1/255,
    speedDU:22.66,
    splatRadiusLines:0.16,
    spreadDeg:11.66,
  },
  { // リッター4K (charger) — parameters from your spec
    name:'リッター4K',
    type:'charger',
    weightClass:'重量級',
    chargeFrames: 92,                  // full charge (F)
    minChargeFramesToFire: 8,          // minimum to consider a fire (NC)
    shotDelayFrames: 1,                // 発射隙
    chargeRestartFrames: 6,            // next charge can begin after this many frames
    squidLockoutFrames: 16,
    inkRecoveryLockoutFrames: 19,
    // No-charge vs half/full values (simplified interpolation)
    rangeLinesNoCharge:2.3, rangeLinesFull:6.2,
    speedDUNoCharge:24.0, speedDUFull:96.0,
    damageNoCharge:40.0, damageHalfChargeMax:79.9, damageFull:180.0,
    inkPerShotNoCharge:2.25, inkPerShotFull:25,
    footPaintRadiusLines:0.24,
    projectileSizeEnemyLines:0.045,
    // some visual trail params
    trailDropCountNoCharge:3, trailDropCountFull:13,
  }
];

let currentWeaponIndex = 0;

// --- player state
const player = {
  x: W/2, y: H/2, radius: 12,
  ink: 100, maxInk: 100,
  form: 'human', // 'human' | 'squid'
  isSwimming: false,
  // charger-related
  charging: false,
  chargeFramesElapsed: 0,
  chargeCooldownFramesLeft: 0,
  squidLockoutFramesLeft: 0,
  inkRecoveryLockoutLeft: 0,
};

// --- simple dummy target
const dummy = { x: W - 120, y: H/2, radius: 16, hp:100, maxHp:100 };

// --- projectiles (for shooter-type)
const projectiles = [];
const chargerFlashes = []; // visual-only for charger

// --- coverage sampling state
let totalPaintPoints = 0;
let prevSampleMask = null; // Uint8Array used for diff-based sampling

// --- input
const keys = { w:false,a:false,s:false,d:false };
let mouse = { x: player.x, y: player.y, down:false };
let aimLocked = false;
let lastFrameTime = performance.now();
let frameCount = 0;

// --- UI elements
const coverageValueEl = document.getElementById('coverage-value');
const chargeWrapEl = document.getElementById('charge-wrap');
const chargeInnerEl = document.getElementById('charge-gauge-inner');
const weaponNameEl = document.getElementById('weapon-name');
const weaponStatsEl = document.getElementById('weapon-stats');
const resetBtn = document.getElementById('reset-btn');
const toggleCoverageBtn = document.getElementById('toggle-coverage-btn');
const weaponSwitchEl = document.getElementById('weapon-switch');

// coverage overlay
let coverageOverlayVisible = false;
let coverageOverlayCanvas = null;
let coverageOverlayCtx = null;

// --- utilities
function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
function lerp(a,b,t){ return a + (b-a)*t; }

// --- rendering helpers (blob generation + drawing)
function blobPoints(cx,cy,baseRadius,numPoints=10,irregularity=0.3,stretchDir,stretchAmt){
  const pts = [];
  for (let i=0;i<numPoints;i++){
    const angle = (i/numPoints)*Math.PI*2 + (Math.random()-0.5)*(Math.PI/numPoints);
    let r = baseRadius * (0.75 + Math.random()*0.35);
    if (Math.random() < 0.22) r *= 1.35 + Math.random()*0.5;
    if (stretchDir !== undefined){
      const rel = Math.atan2(Math.sin(angle - stretchDir), Math.cos(angle - stretchDir));
      const forwardFactor = (Math.cos(rel) + 1)/2;
      r *= 1 + (stretchAmt - 1)*forwardFactor;
    }
    r *= (1 + (Math.random()-0.5) * 2 * irregularity);
    pts.push({x: cx + Math.cos(angle)*r, y: cy + Math.sin(angle)*r});
  }
  return pts;
}
function drawSmoothBlobPath(ctx, points){
  const n = points.length;
  if (n === 0) return;
  ctx.beginPath();
  const first = points[0], last = points[n-1];
  ctx.moveTo((last.x + first.x)/2, (last.y + first.y)/2);
  for (let i=0;i<n;i++){
    const p = points[i], next = points[(i+1)%n];
    const mx = (p.x + next.x)/2, my = (p.y + next.y)/2;
    ctx.quadraticCurveTo(p.x, p.y, mx, my);
  }
  ctx.closePath();
}

// coverage (opaque) vs visual (alpha) drawing
function drawCoreBlobCoverage(points){
  const prev = cctx.globalAlpha;
  cctx.fillStyle = TEAM_COLOR;
  cctx.globalAlpha = 1.0;
  drawSmoothBlobPath(cctx, points);
  cctx.fill();
  cctx.globalAlpha = prev;
}
function drawCoreBlobVisual(points){
  const prev = pctx.globalAlpha;
  pctx.fillStyle = TEAM_COLOR;
  pctx.globalAlpha = 0.9 + Math.random()*0.1;
  drawSmoothBlobPath(pctx, points);
  pctx.fill();
  pctx.globalAlpha = prev;
}

// decoration helpers
function paintTendril(cx,cy,angle,startDist,length,width){
  const dx = Math.cos(angle), dy = Math.sin(angle);
  const px = -dy, py = dx;
  const sx = cx + dx*startDist, sy = cy + dy*startDist;
  const ex = cx + dx*(startDist + length), ey = cy + dy*(startDist + length);
  const bend = (Math.random()-0.5) * width * 3;
  const mx = cx + dx*(startDist + length*0.55) + px*bend;
  const my = cy + dy*(startDist + length*0.55) + py*bend;
  pctx.globalAlpha = 0.85 + Math.random()*0.15;
  pctx.beginPath();
  pctx.moveTo(sx + px*width, sy + py*width);
  pctx.quadraticCurveTo(mx + px*width*0.35, my + py*width*0.35, ex, ey);
  pctx.quadraticCurveTo(mx - px*width*0.35, my - py*width*0.35, sx - px*width, sy - py*width);
  pctx.closePath();
  pctx.fill();
  if (Math.random() < 0.65){
    pctx.beginPath();
    pctx.arc(ex,ey,width*(1 + Math.random()*1.4),0,Math.PI*2);
    pctx.fill();
  }
}
function paintSpatter(cx,cy,baseRadius,biasDir){
  const count = 4 + Math.floor(Math.random()*5);
  for (let i=0;i<count;i++){
    const angle = (biasDir !== undefined && Math.random()<0.55) ? biasDir + (Math.random()-0.5)*1.3 : Math.random()*Math.PI*2;
    const dist = baseRadius * (1.05 + Math.random()*1.4);
    const r = baseRadius * (0.04 + Math.random()*0.1);
    pctx.globalAlpha = 0.65 + Math.random()*0.35;
    pctx.beginPath();
    pctx.arc(cx + Math.cos(angle)*dist, cy + Math.sin(angle)*dist, r, 0, Math.PI*2);
    pctx.fill();
  }
}

// plain splat -> draws to both coverage and visual
function paintSplat(cx,cy,baseRadius){
  const numPoints = 8 + Math.floor(Math.random()*4);
  const core = blobPoints(cx,cy,baseRadius,numPoints,0.3);
  drawCoreBlobCoverage(core);
  drawCoreBlobVisual(core);

  if (Math.random() < 0.6){
    const angle = Math.random()*Math.PI*2;
    const dist = baseRadius * (0.15 + Math.random()*0.3);
    const sub = blobPoints(cx + Math.cos(angle)*dist, cy + Math.sin(angle)*dist, baseRadius * (0.4 + Math.random()*0.3), 7, 0.35);
    drawCoreBlobCoverage(sub);
    drawCoreBlobVisual(sub);
  }
  paintSpatter(cx,cy,baseRadius);
  pctx.globalAlpha = 1;
}

// stretched landing splat (directional)
function paintSplatStretched(cx,cy,baseRadius,dirAngle,stretchRatio){
  const centerShift = baseRadius * (stretchRatio - 1) * 0.3;
  const bx = cx + Math.cos(dirAngle) * centerShift;
  const by = cy + Math.sin(dirAngle) * centerShift;
  const numPoints = 10 + Math.floor(Math.random()*4);
  const core = blobPoints(bx,by,baseRadius,numPoints,0.28,dirAngle,stretchRatio);
  drawCoreBlobCoverage(core);
  drawCoreBlobVisual(core);
  const secondaryCount = 1 + Math.floor(Math.random()*2);
  for (let i=0;i<secondaryCount;i++){
    const angle = dirAngle + (Math.random()-0.5)*2.2;
    const dist = baseRadius * (0.2 + Math.random()*0.4);
    const sub = blobPoints(bx + Math.cos(angle)*dist, by + Math.sin(angle)*dist, baseRadius*(0.35 + Math.random()*0.3), 7, 0.35);
    drawCoreBlobCoverage(sub);
    drawCoreBlobVisual(sub);
  }
  const tendrilCount = 3 + Math.floor(Math.random()*4);
  for (let i=0;i<tendrilCount;i++){
    const angle = Math.random() < 0.7 ? dirAngle + (Math.random()-0.5)*1.5 : Math.random()*Math.PI*2;
    const startDist = baseRadius * (0.55 + Math.random()*0.3);
    const length = baseRadius * (0.35 + Math.random()*0.55) * (0.6 + stretchRatio*0.4);
    const width = baseRadius * (0.08 + Math.random()*0.07);
    paintTendril(bx,by,angle,startDist,length,width);
  }
  paintSpatter(bx,by,baseRadius,dirAngle);
  pctx.globalAlpha = 1;
}

// Clip painting so it doesn't land inside obstacles
function paintSplatClipped(cx,cy,baseRadius,dirAngle,stretchRatio){
  const inWall = OBSTACLES.some(o => rectsOverlap(cx,cy,baseRadius,o));
  if (inWall) return;
  if (dirAngle !== undefined && stretchRatio !== undefined){
    paintSplatStretched(cx,cy,baseRadius,dirAngle,stretchRatio);
  } else {
    paintSplat(cx,cy,baseRadius);
  }
}

// --- charge/shoot logic
function startChargeIfNeeded(){
  const w = WEAPONS[currentWeaponIndex];
  if (w.type !== 'charger') return;
  if (player.chargeCooldownFramesLeft > 0) return;
  player.charging = true;
  // pre-delay could be implemented; simplified: start counting next frame
}
function stopChargeAndFire(){
  const w = WEAPONS[currentWeaponIndex];
  if (w.type !== 'charger' && w.type !== 'shooter') return;
  if (w.type === 'charger'){
    if (!player.charging) return;
    fireChargerShot();
    player.charging = false;
    player.chargeFramesElapsed = 0;
  } else {
    // shooter: start a shot (simple single-shot on release)
    fireShot();
  }
}

// shooter fire (simple immediate hit at cursor / limited range)
function fireShot(){
  const w = WEAPONS[currentWeaponIndex];
  if (!w || !w.inkPerShot) return;
  if (player.ink < w.inkPerShot) return;
  player.ink -= w.inkPerShot;
  // for simplicity we instant-spawn a projectile that moves towards cursor at fixed travel
  const angle = player.aimAngle;
  const speed = (w.speedDU || 22.66) * 2; // coarse px/sec scaling
  projectiles.push({
    x: player.x, y: player.y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
    life: 60, traveled:0, maxLife: 100, weapon: w
  });
}

// charger fire implementation (hit-scan style simplified)
function fireChargerShot(){
  const w = WEAPONS[currentWeaponIndex];
  if (!w) return;
  // enfore minimum frames to allow firing (NC requirement)
  let frames = player.chargeFramesElapsed;
  if (frames < w.minChargeFramesToFire) frames = w.minChargeFramesToFire;
  const fraction = clamp(frames / w.chargeFrames, 0, 1);
  let damage, inkCost, rangeLines;
  if (fraction >= 1){
    damage = w.damageFull;
    inkCost = w.inkPerShotFull;
    rangeLines = w.rangeLinesFull;
  } else {
    // interpolate linearly between NoCharge and half-charge-max (approx)
    const t = fraction; // 0..1
    damage = lerp(w.damageNoCharge, w.damageHalfChargeMax, t);
    inkCost = lerp(w.inkPerShotNoCharge, w.inkPerShotFull, t);
    rangeLines = lerp(w.rangeLinesNoCharge, w.rangeLinesFull, t);
  }
  // check ink
  if (player.ink < inkCost) {
    // insufficient ink -> fail gracefully
    player.chargeFramesElapsed = 0;
    player.charging = false;
    return;
  }
  player.ink -= inkCost;

  // compute target point (cursor distance capped by range)
  const cursorDist = Math.hypot(mouse.x - player.x, mouse.y - player.y);
  const targetRangePx = Math.min(cursorDist, lines(rangeLines));
  const dir = Math.atan2(mouse.y - player.y, mouse.x - player.x);
  const tx = player.x + Math.cos(dir) * targetRangePx;
  const ty = player.y + Math.sin(dir) * targetRangePx;

  // paint impacts: tip splat + trail drops simplified
  const tipRadius = lerp(w.tipSplatRadiusNoCharge || 0.21, w.tipSplatRadiusFull || 0.77, fraction) * PIXELS_PER_LINE;
  paintSplatClipped(tx, ty, tipRadius, dir, 1.0);

  // trail drops: spread along line
  const dropCount = Math.round(lerp(w.trailDropCountNoCharge || 3, w.trailDropCountFull || 13, fraction));
  for (let i=1;i<=dropCount;i++){
    const t = i / (dropCount + 1);
    const px = player.x + (tx - player.x) * t;
    const py = player.y + (ty - player.y) * t;
    const radius = lerp(w.trailRadiusVerticalNoCharge || 0.65, w.trailRadiusVerticalFull || 0.37, fraction) * PIXELS_PER_LINE;
    paintSplatClipped(px, py, radius);
  }

  // visual flash
  chargerFlashes.push({x:tx,y:ty,life:12});

  // set cooldowns / locks
  player.chargeCooldownFramesLeft = w.chargeRestartFrames;
  player.squidLockoutFramesLeft = w.squidLockoutFrames;
  player.inkRecoveryLockoutLeft = w.inkRecoveryLockoutFrames;
  player.charging = false;
  player.chargeFramesElapsed = 0;
}

// --- input wiring
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k in keys) keys[k]=true;
  if (k === 'r') resetPaint();
  if (e.key === 'Shift') aimLocked = true;
});
window.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if (k in keys) keys[k]=false;
  if (e.key === 'Shift') aimLocked = false;
});
stage.addEventListener('mousemove', e => {
  const rect = stage.getBoundingClientRect();
  mouse.x = e.clientX - rect.left;
  mouse.y = e.clientY - rect.top;
});
stage.addEventListener('mousedown', e => {
  if (e.button === 0){
    mouse.down = true;
    const w = WEAPONS[currentWeaponIndex];
    if (w.type === 'charger') startChargeIfNeeded();
    else fireShot();
  }
  if (e.button === 2){
    if (player.squidLockoutFramesLeft <= 0) player.form = 'squid';
  }
});
window.addEventListener('mouseup', e => {
  if (e.button === 0){
    mouse.down = false;
    stopChargeAndFire();
  }
  if (e.button === 2) {
    player.form = 'human';
  }
});
stage.addEventListener('contextmenu', e => e.preventDefault());
resetBtn.addEventListener('click', resetPaint);

// coverage overlay toggle
toggleCoverageBtn.addEventListener('click', () => {
  coverageOverlayVisible = !coverageOverlayVisible;
  toggleCoverageBtn.textContent = coverageOverlayVisible ? 'Coverage 表示：ON' : 'Coverage 表示';
  if (coverageOverlayVisible && !coverageOverlayCanvas){
    coverageOverlayCanvas = document.createElement('canvas');
    coverageOverlayCanvas.width = W; coverageOverlayCanvas.height = H;
    coverageOverlayCanvas.style.position = 'absolute';
    coverageOverlayCanvas.style.left = '0'; coverageOverlayCanvas.style.top = '0';
    coverageOverlayCanvas.style.pointerEvents = 'none';
    coverageOverlayCanvas.style.opacity = '0.85';
    document.getElementById('stage-wrap').appendChild(coverageOverlayCanvas);
    coverageOverlayCtx = coverageOverlayCanvas.getContext('2d');
  } else if (!coverageOverlayVisible && coverageOverlayCanvas){
    coverageOverlayCanvas.remove();
    coverageOverlayCanvas = null;
    coverageOverlayCtx = null;
  }
});

// weapon switching UI
function buildWeaponButtons(){
  weaponSwitchEl.innerHTML = '';
  WEAPONS.forEach((w,i)=>{
    const btn = document.createElement('button');
    btn.textContent = w.name;
    if (i === currentWeaponIndex) btn.classList.add('active');
    btn.addEventListener('click', () => {
      switchWeapon(i);
    });
    weaponSwitchEl.appendChild(btn);
  });
}
function switchWeapon(i){
  currentWeaponIndex = i;
  updateWeaponDisplay();
  // show charge UI for chargers
  const w = WEAPONS[currentWeaponIndex];
  chargeWrapEl.style.display = w.type === 'charger' ? 'block' : 'none';
  // reset some player charge state
  player.charging = false;
  player.chargeFramesElapsed = 0;
}
function updateWeaponDisplay(){
  const w = WEAPONS[currentWeaponIndex];
  document.getElementById('weapon-name').textContent = w.name;
  document.getElementById('weapon-stats').textContent = w.type === 'charger' ? 'チャージャー' : 'シューター';
  // update buttons active state
  Array.from(weaponSwitchEl.children).forEach((b, idx)=> b.classList.toggle('active', idx === currentWeaponIndex));
}
buildWeaponButtons();
updateWeaponDisplay();
switchWeapon(0); // default

// --- reset / guards
function resetPaint(){
  pctx.clearRect(0,0,W,H);
  cctx.clearRect(0,0,W,H);
  player.ink = player.maxInk;
  totalPaintPoints = 0;
  prevSampleMask = null;
  player.charging = false;
  player.chargeFramesElapsed = 0;
  player.chargeCooldownFramesLeft = 0;
  player.squidLockoutFramesLeft = 0;
  player.inkRecoveryLockoutLeft = 0;
}

// --- coverage sampling (downsample & diff) ---
function computeCoverageSample(){
  // sample at small resolution to reduce cost
  const sampleW = 200, sampleH = Math.round(sampleW * H / W);
  const temp = document.createElement('canvas');
  temp.width = sampleW; temp.height = sampleH;
  const tctx = temp.getContext('2d');
  // draw coverageLayer scaled down
  tctx.clearRect(0,0,sampleW,sampleH);
  tctx.drawImage(coverageLayer, 0,0,sampleW,sampleH);
  const img = tctx.getImageData(0,0,sampleW,sampleH).data;
  const mask = new Uint8Array(sampleW*sampleH);
  let count = 0;
  for (let i=0;i<sampleW*sampleH;i++){
    const a = img[i*4 + 3];
    if (a > 16){ mask[i]=1; count++; } else mask[i]=0;
  }
  // compute diff if we have previous mask
  let paintedDelta = 0;
  if (prevSampleMask && prevSampleMask.length === mask.length){
    for (let i=0;i<mask.length;i++){
      if (mask[i] && !prevSampleMask[i]) paintedDelta++;
    }
  } else {
    paintedDelta = count; // first time
  }
  prevSampleMask = mask;
  // convert to "points" roughly: use count proportion to area
  totalPaintPoints = Math.round((count / mask.length) * 1000); // arbitrary scale to show value
  coverageValueEl.textContent = totalPaintPoints + 'pt';
}

// run computeCoverageSample occasionally (every 200ms)
setInterval(computeCoverageSample, 200);

// --- update loops ---
function update(deltaFrames){
  // charging logic (per-frame)
  const w = WEAPONS[currentWeaponIndex];
  if (w.type === 'charger'){
    if (player.charging && player.chargeCooldownFramesLeft <= 0){
      // accumulate frames (apply slowdown if low ink, simplified ignored)
      player.chargeFramesElapsed = clamp(player.chargeFramesElapsed + 1, 0, w.chargeFrames);
      const pct = player.chargeFramesElapsed / w.chargeFrames;
      chargeInnerEl.style.width = Math.round(pct*100) + '%';
    } else {
      // not charging: ensure UI shows 0
      if (!player.charging) chargeInnerEl.style.width = '0%';
    }
  } else {
    chargeInnerEl.style.width = '0%';
  }

  // cooldown counters
  if (player.chargeCooldownFramesLeft > 0) player.chargeCooldownFramesLeft = Math.max(0, player.chargeCooldownFramesLeft - deltaFrames);
  if (player.squidLockoutFramesLeft > 0) player.squidLockoutFramesLeft = Math.max(0, player.squidLockoutFramesLeft - deltaFrames);
  if (player.inkRecoveryLockoutLeft > 0) player.inkRecoveryLockoutLeft = Math.max(0, player.inkRecoveryLockoutLeft - deltaFrames);

  // ink regen (only human passive regen here)
  if (player.inkRecoveryLockoutLeft <= 0 && player.ink < player.maxInk){
    player.ink = Math.min(player.maxInk, player.ink + 0.5 * deltaFrames); // regen speed approx
    const pct = (player.ink / player.maxInk) * 100;
    document.getElementById('ink-gauge-inner').style.width = pct + '%';
  }

  // projectiles update
  for (let i = projectiles.length - 1; i >= 0; i--){
    const pr = projectiles[i];
    pr.x += pr.vx * (1/60);
    pr.y += pr.vy * (1/60);
    pr.life--;
    // simple collision with dummy or walls
    if (Math.hypot(pr.x - dummy.x, pr.y - dummy.y) < dummy.radius + (pr.weapon.projectileSizeEnemyLines || 0)*PIXELS_PER_LINE/2){
      // hit dummy: paint and remove
      paintSplatClipped(pr.x, pr.y, (pr.weapon.splatRadiusLines || 0.12) * PIXELS_PER_LINE);
      projectiles.splice(i,1);
      continue;
    }
    if (pr.x < 0 || pr.x > W || pr.y < 0 || pr.y > H || pr.life <= 0){
      projectiles.splice(i,1);
    }
  }

  // chargerFlashes decay
  for (let i = chargerFlashes.length - 1; i >= 0; i--){
    chargerFlashes[i].life--;
    if (chargerFlashes[i].life <= 0) chargerFlashes.splice(i,1);
  }

  // player movement (very basic)
  let mvx = 0, mvy = 0;
  if (keys.w) mvy -= 1;
  if (keys.s) mvy += 1;
  if (keys.a) mvx -= 1;
  if (keys.d) mvx += 1;
  if (mvx !== 0 || mvy !== 0){
    const len = Math.hypot(mvx,mvy);
    const speed = 120; // px/sec
    player.x += (mvx/len) * speed * (deltaFrames/60);
    player.y += (mvy/len) * speed * (deltaFrames/60);
    player.x = clamp(player.x, 0, W);
    player.y = clamp(player.y, 0, H);
  }
}

function render(){
  // clear stage
  ctx.clearRect(0,0,W,H);
  // floor fill (canvas background already)
  // draw paint layer composite
  ctx.drawImage(paintLayer, 0, 0);

  // draw obstacles (visual)
  ctx.fillStyle = '#0b0c10';
  ctx.strokeStyle = '#222';
  OBSTACLES.forEach(o=>{
    ctx.fillRect(o.x, o.y, o.w, o.h);
    ctx.strokeRect(o.x+0.5, o.y+0.5, o.w-1, o.h-1);
  });

  // draw projectiles (simple)
  ctx.fillStyle = '#fff';
  projectiles.forEach(pr=>{
    ctx.beginPath(); ctx.arc(pr.x, pr.y, 3, 0, Math.PI*2); ctx.fill();
  });

  // draw charger flashes
  ctx.globalCompositeOperation = 'lighter';
  chargerFlashes.forEach(f=>{
    const alpha = f.life/12;
    ctx.fillStyle = `rgba(255,255,255,${0.8*alpha})`;
    ctx.beginPath(); ctx.arc(f.x,f.y, 6 + (1-alpha)*8, 0, Math.PI*2); ctx.fill();
  });
  ctx.globalCompositeOperation = 'source-over';

  // draw player
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI*2); ctx.fill();
  // aim reticle
  ctx.strokeStyle = 'rgba(255,255,255,0.35)';
  ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke();

  // draw dummy
  ctx.fillStyle = '#e8e8e8';
  ctx.beginPath(); ctx.arc(dummy.x, dummy.y, dummy.radius, 0, Math.PI*2); ctx.fill();

  // if coverage overlay visible, update it
  if (coverageOverlayVisible && coverageOverlayCtx){
    coverageOverlayCtx.clearRect(0,0,W,H);
    coverageOverlayCtx.drawImage(coverageLayer, 0, 0);
  }
}

// main loop
function tick(now){
  const dt = now - lastFrameTime;
  const deltaFrames = Math.max(1, Math.round(dt / (1000/60)));
  update(deltaFrames);
  render();
  lastFrameTime = now;
  frameCount++;
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

// --- initialization: small demo paint to show things working
(function seedDemo(){
  // clear layers
  pctx.clearRect(0,0,W,H); cctx.clearRect(0,0,W,H);
  // seed a few splats
  paintSplatClipped(240,180, lines(0.5));
  paintSplatClipped(420,360, lines(0.32));
  paintSplatClipped(700,240, lines(0.38));
  computeCoverageSample();
})();

</script>
